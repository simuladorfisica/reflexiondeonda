<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario | Reflexión de ondas</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="cuestionario.js" defer></script>
</head>
<body>
  <a class="back-link" href="index.html">Volver al inicio</a>
  <main class="page-wrap quiz-page">
    <h1 class="page-title">Prueba tus conocimientos</h1>
    <p class="page-intro">Elegí una respuesta para cada pregunta. La página te indicará cuál es la opción correcta.</p>
    <div id="quiz-container"></div>
    <div class="quiz-bottom">
      <button class="btn" id="check-quiz" type="button">Ver resultado</button>
      <button class="btn btn-secondary" id="reset-quiz" type="button">Volver a intentar</button>
      <p id="quiz-result" class="result-message" aria-live="polite"></p>
    </div>
  </main>
</body>
</html>
